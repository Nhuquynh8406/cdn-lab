<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1320" viewBox="0 0 1480 1320"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Times New Roman,serif" fill="#111"><text x="40" y="48" font-size="36" font-weight="bold">Kiến trúc web và các đường tải tài nguyên</text><rect x="40" y="495" width="310" height="130" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="195" y="552" font-size="29" text-anchor="middle"><tspan x="195" dy="0">Trình duyệt</tspan><tspan x="195" dy="35.96">HTML / JS</tspan></text><rect x="530" y="150" width="400" height="130" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="730" y="207" font-size="29" text-anchor="middle"><tspan x="730" dy="0">Cloudflare edge</tspan><tspan x="730" dy="35.96">www.&lt;domain&gt;</tspan></text><rect x="1050" y="440" width="390" height="130" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1245" y="497" font-size="29" text-anchor="middle"><tspan x="1245" dy="0">Nginx reverse proxy</tspan><tspan x="1245" dy="35.96">HTTPS / chuyển tiếp</tspan></text><rect x="1050" y="680" width="390" height="130" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1245" y="737" font-size="29" text-anchor="middle"><tspan x="1245" dy="0">Express origin</tspan><tspan x="1245" dy="35.96">server.js</tspan></text><rect x="1050" y="930" width="390" height="130" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1245" y="987" font-size="29" text-anchor="middle"><tspan x="1245" dy="0">Filesystem</tspan><tspan x="1245" dy="35.96">static/ và banner.jpg</tspan></text><rect x="530" y="950" width="400" height="130" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="730" y="1007" font-size="29" text-anchor="middle"><tspan x="730" dy="0">jsDelivr tùy chọn</tspan><tspan x="730" dy="35.96">Release public cố định</tspan></text><polyline points="350,520 420,520 420,215 530,215" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="195" font-size="25" text-anchor="middle"><tspan x="420" dy="0">Tuyến CDN</tspan></text><polyline points="930,215 1245,215 1245,440" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1180" y="195" font-size="25" text-anchor="middle"><tspan x="1180" dy="0">Lấy upstream khi cần</tspan></text><polyline points="350,560 1050,560" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="700" y="540" font-size="25" text-anchor="middle"><tspan x="700" dy="0">Tuyến origin trực tiếp</tspan></text><polyline points="1245,570 1245,680" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1245,810 1245,930" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1360" y="875" font-size="25" text-anchor="middle"><tspan x="1360" dy="0">Đọc / thay tệp</tspan></text><polyline points="350,600 420,600 420,1015 530,1015" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="430" y="1140" font-size="25" text-anchor="middle"><tspan x="430" dy="0">Tuyến release</tspan></text><text x="40" y="1220" font-size="25" text-anchor="start"><tspan x="40" dy="0">Hai hostname chính cùng dùng ứng dụng origin. jsDelivr phải có cùng byte tài nguyên để so sánh.</tspan><tspan x="40" dy="31">DNS, TLS và quy tắc CDN là cấu hình triển khai; sơ đồ không khẳng định đã có hệ thống live.</tspan></text></g></svg>