<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1480" viewBox="0 0 1480 1480"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Times New Roman,serif" fill="#111"><text x="40" y="48" font-size="36" font-weight="bold">Cache MISS - mô hình đơn giản một tầng</text><rect x="450" y="100" width="580" height="110" rx="55" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="165" font-size="29" text-anchor="middle"><tspan x="740" dy="0">Browser GET tài nguyên tĩnh</tspan></text><rect x="450" y="300" width="580" height="110" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="347" font-size="29" text-anchor="middle"><tspan x="740" dy="0">Edge không có bản sao</tspan><tspan x="740" dy="35.96">phù hợp để dùng</tspan></text><rect x="450" y="510" width="580" height="120" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="580" font-size="29" text-anchor="middle"><tspan x="740" dy="0">Yêu cầu upstream đến origin</tspan></text><rect x="450" y="730" width="580" height="140" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="774" font-size="29" text-anchor="middle"><tspan x="740" dy="0">Express trả nội dung + headers</tspan><tspan x="740" dy="35.96">Cache-Control, CORS, Timing</tspan><tspan x="740" dy="35.96">và X-Origin-Served-At</tspan></text><polyline points="740,210 740,300" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="740,410 740,510" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="740,630 740,730" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polygon points="740,970 1010,1060 740,1150 470,1060" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="1052" font-size="27" text-anchor="middle"><tspan x="740" dy="0">CDN được phép</tspan><tspan x="740" dy="33.48">lưu phản hồi?</tspan></text><rect x="30" y="1200" width="460" height="100" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="260" y="1260" font-size="29" text-anchor="middle"><tspan x="260" dy="0">Không lưu bản sao</tspan></text><rect x="960" y="1200" width="460" height="100" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1190" y="1260" font-size="29" text-anchor="middle"><tspan x="1190" dy="0">Lưu theo cache policy</tspan></text><polyline points="740,870 740,970" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="470,1060 260,1060 260,1200" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="340" y="1040" font-size="25" text-anchor="middle"><tspan x="340" dy="0">Không</tspan></text><polyline points="1010,1060 1190,1060 1190,1200" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1100" y="1040" font-size="25" text-anchor="middle"><tspan x="1100" dy="0">Có</tspan></text><rect x="450" y="1350" width="580" height="90" rx="45" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="1405" font-size="29" text-anchor="middle"><tspan x="740" dy="0">Trả phản hồi cho browser</tspan></text><polyline points="260,1300 260,1395 450,1395" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1190,1300 1190,1395 1030,1395" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="1460" font-size="25" text-anchor="start"><tspan x="35" dy="0">Trạng thái cache do CDN trả. Nếu có cache tầng trên, edge MISS chưa chứng minh origin nhận request.</tspan></text></g></svg>