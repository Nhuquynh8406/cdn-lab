<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1680" viewBox="0 0 1480 1680"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Times New Roman,serif" fill="#111"><text x="40" y="48" font-size="36" font-weight="bold">Upload và purge - hai thao tác tách biệt</text><rect x="20" y="100" width="280" height="90" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="160" y="155" font-size="29" text-anchor="middle"><tspan x="160" dy="0">Browser admin</tspan></text><line x1="160" y1="190" x2="160" y2="1530" stroke="#111" stroke-width="2" stroke-dasharray="8 8"/><rect x="420" y="100" width="280" height="90" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="560" y="155" font-size="29" text-anchor="middle"><tspan x="560" dy="0">Express API</tspan></text><line x1="560" y1="190" x2="560" y2="1530" stroke="#111" stroke-width="2" stroke-dasharray="8 8"/><rect x="820" y="100" width="280" height="90" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="960" y="155" font-size="29" text-anchor="middle"><tspan x="960" dy="0">Origin disk</tspan></text><line x1="960" y1="190" x2="960" y2="1530" stroke="#111" stroke-width="2" stroke-dasharray="8 8"/><rect x="1180" y="100" width="280" height="90" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1320" y="155" font-size="29" text-anchor="middle"><tspan x="1320" dy="0">Cloudflare API</tspan></text><line x1="1320" y1="190" x2="1320" y2="1530" stroke="#111" stroke-width="2" stroke-dasharray="8 8"/><polyline points="160,300 560,300" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="254" font-size="26" text-anchor="middle"><tspan x="360" dy="0">POST ảnh JPEG</tspan><tspan x="360" dy="32.24">Basic Auth + X-CDN-Lab</tspan></text><rect x="355" y="355" width="410" height="110" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="560" y="402" font-size="29" text-anchor="middle"><tspan x="560" dy="0">Kiểm auth, Origin/header</tspan><tspan x="560" dy="35.96">Multer 5 MiB; Sharp JPEG</tspan></text><polyline points="560,550 960,550" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="760" y="504" font-size="26" text-anchor="middle"><tspan x="760" dy="0">Ghi tệp tạm, rename</tspan><tspan x="760" dy="32.24">thay banner tại origin</tspan></text><polyline points="560,710 160,710" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="664" font-size="26" text-anchor="middle"><tspan x="360" dy="0">JSON: success + hash mới</tspan><tspan x="360" dy="32.24">Chưa gọi purge</tspan></text><polyline points="160,900 560,900" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="854" font-size="26" text-anchor="middle"><tspan x="360" dy="0">POST purge</tspan><tspan x="360" dy="32.24">mode: files hoặc everything</tspan></text><rect x="355" y="950" width="410" height="120" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="560" y="1002" font-size="29" text-anchor="middle"><tspan x="560" dy="0">Kiểm mode, static paths</tspan><tspan x="560" dy="35.96">và cấu hình zone/token</tspan></text><polyline points="560,1160 1320,1160" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="940" y="1114" font-size="26" text-anchor="middle"><tspan x="940" dy="0">POST Cloudflare purge_cache</tspan><tspan x="940" dy="32.24">Token chỉ ở server; timeout 15 giây</tspan></text><polyline points="1320,1310 560,1310" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="940" y="1282" font-size="26" text-anchor="middle"><tspan x="940" dy="0">HTTP + JSON: kiểm success</tspan></text><polyline points="560,1450 160,1450" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="1404" font-size="26" text-anchor="middle"><tspan x="360" dy="0">Acknowledgement hoặc lỗi</tspan><tspan x="360" dy="32.24">không báo thành công giả</tspan></text><text x="40" y="1570" font-size="25" text-anchor="start"><tspan x="40" dy="0">Upload: refresh preview ngay. Purge được chấp nhận: chờ 2 giây rồi refresh ba preview.</tspan><tspan x="40" dy="31">Lỗi: 401/403 auth và nguồn; 400/413 upload/path; 503 thiếu cấu hình; 502 phản hồi provider không hợp lệ.</tspan><tspan x="40" dy="31">API acknowledgement không chứng minh đã cập nhật mọi PoP; phải quan sát phản hồi tiếp theo.</tspan><tspan x="40" dy="31">UI hỏi xác nhận trước purge toàn bộ. Lỗi ngoài dự kiến có thể trả HTTP 500.</tspan></text></g></svg>