<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1130" viewBox="0 0 1480 1130"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Times New Roman,serif" fill="#111"><text x="40" y="48" font-size="36" font-weight="bold">Cache HIT - phản hồi từ edge còn tươi</text><rect x="440" y="100" width="600" height="110" rx="55" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="165" font-size="29" text-anchor="middle"><tspan x="740" dy="0">Browser gửi GET cùng URL</tspan></text><polygon points="740,310 1040,400 740,490 440,400" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="392" font-size="27" text-anchor="middle"><tspan x="740" dy="0">Có bản cache phù hợp</tspan><tspan x="740" dy="33.48">và còn tươi?</tspan></text><rect x="440" y="620" width="600" height="140" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="664" font-size="29" text-anchor="middle"><tspan x="740" dy="0">Edge trả byte đã lưu</tspan><tspan x="740" dy="35.96">CF-Cache-Status: HIT</tspan><tspan x="740" dy="35.96">Age và timestamp của bản cache</tspan></text><rect x="440" y="900" width="600" height="110" rx="55" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="740" y="965" font-size="29" text-anchor="middle"><tspan x="740" dy="0">Browser đọc body / hiển thị</tspan></text><rect x="1090" y="650" width="350" height="130" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1265" y="707" font-size="29" text-anchor="middle"><tspan x="1265" dy="0">Không phải fresh HIT</tspan><tspan x="1265" dy="35.96">Đi upstream theo policy</tspan></text><polyline points="740,210 740,310" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="740,490 740,620" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="785" y="555" font-size="25" text-anchor="middle"><tspan x="785" dy="0">Có</tspan></text><polyline points="740,760 740,900" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1040,400 1265,400 1265,650" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1210" y="380" font-size="25" text-anchor="middle"><tspan x="1210" dy="0">Không</tspan></text><text x="40" y="1080" font-size="25" text-anchor="start"><tspan x="40" dy="0">Trong nhánh HIT này không có yêu cầu đến Express origin. Kiểm tra metadata thực, không tạo header giả.</tspan></text></g></svg>