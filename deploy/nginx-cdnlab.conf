# Cấu hình Nginx cho CDN Lab (origin server).
# Cách dùng trên VM:
#   sudo cp deploy/nginx-cdnlab.conf /etc/nginx/sites-available/cdnlab
#   sudo sed -i 's/YOURDOMAIN/ten-mien-that.xyz/g' /etc/nginx/sites-available/cdnlab
#   sudo ln -s /etc/nginx/sites-available/cdnlab /etc/nginx/sites-enabled/cdnlab
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d origin.YOURDOMAIN -d www.YOURDOMAIN
# Certbot sẽ tự thêm khối listen 443 ssl và chuyển hướng HTTP -> HTTPS.

upstream cdnlab_node {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name origin.YOURDOMAIN www.YOURDOMAIN;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Giữ log đủ thông tin để đếm số request thật sự chạm origin (origin offload).
    access_log /var/log/nginx/cdnlab.access.log;
    error_log  /var/log/nginx/cdnlab.error.log;

    location / {
        proxy_pass http://cdnlab_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;   # cho phép upload ảnh ở trang admin
    }
}
